[tool.poetry]
name = "manifold"
version = "0.1.0"
description = "Unified CLI/Web sync tool for Autotask, UniFi, and more"
authors = ["Jeffrey Brite <jeff@techcollective.com>"]

packages = [
    { include = "manifold_core", from = "src" },
    { include = "manifold_cli", from = "src" },
    { include = "manifold_web", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.12"
typer = "^0.12"
pydantic = "^2.7"
httpx = "^0.27"
jinja2 = "^3.1.6"

flask = "^3.0"
flask-session = "^0.5"
authlib = "^1.2"
python-dotenv = "^1.0"
sqlalchemy = "^2.0.40"
alembic = "^1.15.2"
pyunifi = { git = "https://github.com/TechCollective/pyunifi.git", rev = "master" }
requests = "^2.32.3"

[tool.poetry.scripts]
manifold = "manifold_cli.main:app"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.15.0"
pytest = "^8.3.5"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.mypy]
strict = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
