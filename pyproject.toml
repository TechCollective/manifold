[tool.poetry]
name = "manifold"
version = "0.1.0"
description = "Unified CLI/Web sync tool for Autotask, UniFi, and more"
authors = ["Jeffrey Brite <jeff@techcollective.com>"]
packages = [
    { include = "manifold_core" },
    { include = "manifold_cli" },
    { include = "manifold_web" }
]

[tool.poetry.dependencies]
python = "^3.12"
typer = "^0.12"
fastapi = "^0.111"
uvicorn = "^0.30"
pydantic = "^2.7"
httpx = "^0.27"

[tool.poetry.scripts]
manifold = "manifold_cli.main:app"
