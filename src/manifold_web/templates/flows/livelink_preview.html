<!DOCTYPE html>
<html>
  <head>
    <title>Manifold Autotask Slack Bridge</title>
    <meta charset="utf-8" />
    <script>
      async function startWorkflow() {
        const url = new URL(window.location.href);
        const apiUrl = `/flows/api/livelink/${url.pathname.split("/").pop()}${url.search}`;

        try {
          const response = await fetch(apiUrl);
          const data = await response.json();

          if (data.error) {
            document.getElementById("status").innerText = `❌ ${data.error}`;
            return;
          }

          if (data.slack_error) {
            document.getElementById("status").innerText = `❌ Slack Error: ${data.slack_error}`;
            return;
          }

          if (data.slack_id) {
            document.getElementById("status").innerText = "✅ Slack channel found. Redirecting…";
            window.location.href = `https://slack.com/app_redirect?channel=${data.slack_id}`;
            return;
          }

          document.getElementById("status").innerText = "⚠️ No Slack channel found or created.";
        } catch (err) {
          document.getElementById("status").innerText = `❌ Unexpected error: ${err}`;
        }
      }

      window.onload = startWorkflow;
    </script>
  </head>
  <body>
    <h1>Manifold Autotask Slack Bridge</h1>
    <p id="status">🔄 Starting lookup…</p>
  </body>
</html>
