{% extends "base.html" %}

{% block title %}Add Credentials | Manifold{% endblock %}

{% block content %}
<h2>Add Credentials</h2>

<div class="actions-area">
    <div class="actions-header">
        <h3>Add Credentials for: {{ server.name }}</h3>
    </div>
</div>

<form method="POST" action="/unifi/credentials">
    <input type="hidden" name="id" value="{{ server.id }}">
    
    <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
    </div>
    
    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
    </div>
    
    <div class="modal-actions">
        <a href="/unifi" class="command-button">Cancel</a>
        <button type="submit" class="command-button">Save Credentials</button>
    </div>
</form>

<style>
.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

.form-group input {
    width: 100%;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 14px;
}
</style>
{% endblock %}
